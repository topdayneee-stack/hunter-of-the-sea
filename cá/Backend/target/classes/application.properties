# =====================================================================
# CẤU HÌNH KẾT NỐI CSDL CHÍNH: MICROSOFT SQL SERVER
# =====================================================================

# 1. URL kết nối CSDL SQL Server (Mặc định cổng 1433, CSDL hunter_of_the_sea)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=hunter_of_the_sea;encrypt=true;trustServerCertificate=true;

# 2. Tài khoản và Mật khẩu SQL Server (Thay đổi nếu dùng tài khoản khác)
spring.datasource.username=sa
spring.datasource.password=ca123

# 3. Cấu hình Driver và JPA (Hibernate)
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.database-platform=org.hibernate.dialect.SQLServer2016Dialect

# Tự động cập nhật bảng nếu chưa có (rất an toàn, không xóa dữ liệu cũ)
spring.jpa.hibernate.ddl-auto=update

# Hiển thị SQL trên Console khi truy vấn
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 4. QUAN TRỌNG: Giữ nguyên tên bảng chính xác theo CSDL_CA.sql (Users, Characters,...)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
