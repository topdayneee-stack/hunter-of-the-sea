# =====================================================================
# CẤU HÌNH TEST OFFLINE NHANH BẰNG CSDL IN-MEMORY H2
# Kích hoạt bằng tham số: --spring.profiles.active=h2
# =====================================================================

spring.datasource.url=jdbc:h2:mem:hunter_of_the_sea;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MSSQLServer
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Giao diện xem dữ liệu H2 Console trên trình duyệt: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
